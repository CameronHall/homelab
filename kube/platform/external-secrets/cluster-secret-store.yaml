apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      auth:
        universalAuthCredentials:
          clientId:
            secretRef:
              name: infisical-universal-auth
              namespace: external-secrets
              key: clientId
          clientSecret:
            secretRef:
              name: infisical-universal-auth
              namespace: external-secrets
              key: clientSecret
      hostAPI: https://app.infisical.com/api
      secretsScope:
        projectSlug: homelab
        environmentSlug: prod
        secretsPath: /
        recursive: true
