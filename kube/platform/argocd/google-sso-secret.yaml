apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-google-sso
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: argocd-google-sso
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientId
      remoteRef:
        key: ARGOCD_SSO_GOOGLE_CLIENT_ID
    - secretKey: clientSecret
      remoteRef:
        key: ARGOCD_SSO_GOOGLE_CLIENT_SECRET
    - secretKey: adminEmail
      remoteRef:
        key: ARGOCD_ADMIN_EMAIL
