apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-vm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  ingressClassName: tailscale
  rules:
    - host: argocd-vm
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
  tls:
    - hosts:
        - argocd-vm
