[project]
name = "homelab-provisioning-bootstrap"
version = "0.1.0"
description = "NoCloud bootstrap provisioning services backed by Tailscale OAuth."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.3",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.49",
    "uvicorn[standard]==0.44.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.uv]
package = false
